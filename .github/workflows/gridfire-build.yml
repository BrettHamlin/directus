name: Gridfire Build

# gridfire_template_version: stage3-ts-monorepo/v1

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch or ref generated by Gridfire.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout generated ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API dependency closure
        run: pnpm --filter @directus/api... build
